# KSA AiGamopedia
#
# 1. HTTP only (first install):
#    cp scripts/nginx-ksa.aigamopedia.com.conf /etc/nginx/sites-available/ksa.aigamopedia.com
#    ln -sf /etc/nginx/sites-available/ksa.aigamopedia.com /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#
# 2. SSL (after DNS A record points to this server):
#    certbot --nginx -d ksa.aigamopedia.com

server {
    listen 80;
    listen [::]:80;
    server_name ksa.aigamopedia.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        proxy_pass http://127.0.0.1:5055;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
